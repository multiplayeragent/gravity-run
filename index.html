<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravity Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0d0b24; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 6px #000c; }
  #place { top: max(10px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); font: 900 30px/1.05 system-ui, sans-serif; }
  #place small { display: block; font-size: 13px; font-weight: 700; opacity: .9; }
  #track { top: calc(max(10px, env(safe-area-inset-top)) + 12px); right: max(36px, calc(env(safe-area-inset-right) + 36px)); width: min(420px, 50vw); height: 8px; border-radius: 4px; background: #ffffff22; }
  #track i { position: absolute; top: -4px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; border: 2px solid #fff; box-sizing: border-box; }
  #track i.me { width: 22px; height: 22px; top: -7px; margin-left: -11px; z-index: 2; box-shadow: 0 0 0 2px #ffe14d; }
  #track b { position: absolute; right: -18px; top: -12px; font-size: 20px; }
  #track[hidden], #over[hidden], #flipBtn[hidden] { display: none; }
  #msg { top: 26%; left: 0; right: 0; text-align: center; font: 900 72px/1 system-ui, sans-serif; color: #ffe14d; -webkit-text-stroke: 3px #5a1a6a; }
  #msg small { display: block; margin-top: 10px; font-size: 22px; color: #fff; -webkit-text-stroke: 0; }
  #hint { top: calc(max(10px, env(safe-area-inset-top)) + 46px); left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 700; padding: 0 12px; }
  #net { bottom: max(6px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .8; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #07051899; }
  .card { width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 16px; background: #1c1748f2; border: 1px solid #ffffff30; text-align: center; box-sizing: border-box; }
  .card h2 { margin: 0 0 4px; font-size: 26px; color: #ffe14d; }
  .card h3 { margin: 14px 0 4px; font-size: 13px; color: #8ff0ff; text-align: left; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; }
  .card li span { float: right; font-variant-numeric: tabular-nums; } .card li.me { color: #ffe14d; font-weight: 700; }
  .card li.note { list-style: none; margin-left: -24px; opacity: .8; }
  .card p { margin: 10px 0 0; font-size: 13px; opacity: .75; }
  button.go { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 12px; background: #ffe14d; color: #3a1a40; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  #flipBtn { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 14px); width: 104px; height: 104px; border-radius: 50%; border: 2px solid #ffffffaa; background: #ff3fd855; color: #fff; font: 900 18px system-ui, sans-serif; touch-action: none; }
  #flipBtn.on { background: #ff3fd8aa; }
  @media (max-width: 560px) { #hint { top: calc(max(10px, env(safe-area-inset-top)) + 70px); font-size: 14px; } #msg { font-size: 56px; } }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="place"></div>
<div class="hud" id="track" hidden><b>🏁</b></div>
<div class="hud" id="hint"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="net">Connecting…</div>
<button id="flipBtn" hidden>FLIP</button>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><div id="overSub"></div>
  <h3>This race</h3><ol id="results"></ol>
  <h3>Most races won</h3><ol id="board"><li class="note">Loading…</li></ol>
  <button class="go" id="again">Race again</button><p id="next"></p>
</div></div>
<script>
/* ═══ GRAVITY RUN · a Multiplayer Agent starter ═════════════════════════════════════════
 * Everyone runs on their own. One button flips your gravity: floor to ceiling and back.
 * Dodge gaps and spikes, hit speed pads, reach the end first. Versus, 2–8 players; bots fill seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ speed, gravity, pads, the race timer, bots
 *   CHUNKS ........ the course pieces, drawn as text (legend inside). A race strings them together.
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host, the shared clock
 *   COURSE ........ builds one course from the race seed
 *   RUNNERS ....... one physics step for anyone (you or a bot): run, flip, land, pads, spikes
 *   RACE (HOST) ... countdown, finishers, the timer, results, the next race, the bots
 *   BOTS .......... the bot brain: it tries "keep going" and "flip now" in its head, then reacts (a bit late, sometimes)
 *   ME ............ your runner, falls and respawns. Each player writes only its own.
 *   DRAW .......... the neon course, ghosts of the others, trails, particles
 *   HUD & RESULTS . your place, the progress track, the countdown, results, leaderboard
 *   INPUT ......... Space / click / tap / the FLIP button
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one JSON field: position, gravity, speed, dead,
 *     finished time, race id) about 12 times a second, `hb` (heartbeat) once a second, `n`/`c` once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes `race` (ONE JSON field: id, version v,
 *     phase grid|race|done, seed, startAt, endsAt, finishers, results), `bots` (~10/s) and
 *     `clk` (its clock, every 2s). A new host adopts all three and carries on.
 *   - Everyone builds the same course from race.seed. Runners don't touch: the others are ghosts.
 *   - The host reads each player's own `p` to see who finished and when (no intents needed),
 *     plus "again" {} from the results card.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "race-wins": +1 for every race you win, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 6,              // bots fill the race up to this many runners
  maxRunners: 8,
  chunks: 20,            // course pieces between the start and the finish (picked by the seed)
  countdown: 3000,       // ms of "3, 2, 1"
  raceMs: 90000,         // the race ends after this: whoever got furthest wins
  afterFirstMs: 8000,    // once someone finishes, the others get this long
  resultsMs: 9000,       // ms the results show before the next race
  speed: 8.5,            // running speed, tiles/s (everyone runs on their own)
  padBoost: 1.5,         // a speed pad multiplies your speed by this...
  padTime: 1.4,          // ...for this many seconds
  gravity: 60, maxFall: 20,
  flipKick: 3,           // a flip pushes you off the surface this fast
  coyote: 0.08, buffer: 0.14, // forgiving flips (s): a little late off an edge, a little early before landing
  respawnMs: 900,        // ms before you're back at the start of the piece you fell in
  botReact: [70, 200],   // ms a bot takes to flip once it sees it must
  botLook: 0.7,          // how far ahead a bot looks, in seconds (less = more mistakes)
  botLate: 0.12,         // chance a bot reacts much too late (and probably falls)
  botStartLag: 450,      // ms: bots leave the start line up to this late
  sendMs: 80,            // how often your runner is sent (~12/s)
  board: "race-wins",    // leaderboard: races won
};
const BOT_NAMES = ["Flux", "Pulse", "Orbit", "Volt", "Nova", "Blip", "Zap", "Quark"];
const COLORS = ["#ff4f8b", "#34d0ff", "#ffd23f", "#4dff9a", "#b072ff", "#ff8a3d", "#f2f2f2", "#7dffea", "#ff5a5f", "#9cff57"];

// ── CHUNKS ──────────────────────────────────────────────────────────────────────────
// Every piece is 12 rows tall: row 0 is the ceiling, row 11 the floor. Every piece starts and ends
// with floor AND ceiling (that's where you respawn). Legend (letters and symbols, never digits):
//   .  air   #  wall   ^  spikes on the floor   v  spikes on the ceiling   >  speed pad (a wall you run on, faster)
const F16 = "################", E16 = "................";
const air = (n, row = E16) => Array(n).fill(row);
const CHUNKS = {
  start:      [F16 + F16, ...air(10, E16 + E16), F16 + F16],
  flat:       [F16, ...air(10), "####>>>>########"],
  floorGap:   [F16, ...air(10), "####.......#####"],
  ceilGap:    ["#####.......####", ...air(10), F16],
  spikesLow:  [F16, ...air(9), "....^^^^^^......", F16],
  spikesHigh: [F16, "....vvvvvv......", ...air(9), F16],
  pillarUp:   [F16, ...air(4), ...air(6, ".......###......"), F16],
  pillarDown: [F16, ...air(6, ".......###......"), ...air(4), F16],
  step:       [F16, ...air(7), ...air(3, "........########"), F16],
  zigzag:     ["############......######", ...air(10, E16 + "........"), "####.....###############"],
  padsHigh:   ["#####>>>>>>>####", ...air(9), "......^^^^......", F16],
  island:     ["###.........######", ...air(4, "..................") , ...air(2, "...#########......"), ...air(4, ".................."), "###.........######"],
  spikeDuo:   [F16 + "####", ".............vvvv...", ...air(8, E16 + "...."), "...^^^^.............", F16 + "####"],
  finish:     [F16 + F16, ...air(10, E16 + E16), F16 + F16],
};
const ATTRACT_CHUNKS = ["floorGap", "spikesHigh", "pillarUp", "zigzag", "padsHigh", "island", "spikeDuo", "ceilGap", "step", "floorGap"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'gravity-run',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const $ = (id) => document.getElementById(id);

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
const shared = (key, fallback) => parseOnce("s:" + key, S.shared[key], fallback);
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let hostHold = 0, lastTick = performance.now(); // lastTick: when frame() last ran; hostHold: after a freeze, no hosting before this time (see frame())
const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; // a tab whose loop has stopped doesn't host
const humansHere = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));
// The shared clock: the host's Date.now() plus its own offset, learned from `clk` changes.
const clockSync = { offset: 0, seen: undefined, samples: [], lastWrite: 0 };
const clock = () => Date.now() + clockSync.offset;
function syncClock(now) {
  if (isHost()) { if (now - clockSync.lastWrite > 2000) { clockSync.lastWrite = now; net.setShared("clk", clock()); } return; }
  const clk = Number(S.shared.clk);
  if (!clk || clk === clockSync.seen) return;
  if (clockSync.seen !== undefined) { // the first value we see may be old; later changes are fresh
    clockSync.samples = [...clockSync.samples.slice(-4), clk - Date.now()];
    clockSync.offset = Math.max(...clockSync.samples); // the least-delayed sample is the best
  }
  clockSync.seen = clk;
}

// ── COURSE ──────────────────────────────────────────────────────────────────────────
const ROWS = 12, SOLID = "#>";
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let C = null; // the course: { seed, cols, grid (one string per row), starts (where each piece begins), finish }
/** One course from a seed: the start, CONFIG.chunks pieces (no piece twice in a row), the finish. */
function buildCourse(seed) {
  const rnd = mulberry32(seed), names = Object.keys(CHUNKS).filter((k) => k !== "start" && k !== "finish"), pick = [];
  if (ATTRACT) pick.push(...ATTRACT_CHUNKS);
  else while (pick.length < CONFIG.chunks) { const k = names[Math.floor(rnd() * names.length)]; if (k !== pick[pick.length - 1]) pick.push(k); }
  const rows = Array(ROWS).fill(""), starts = [];
  for (const name of ["start", ...pick, "finish"]) { starts.push(rows[0].length); CHUNKS[name].forEach((line, r) => { rows[r] += line; }); }
  return { seed, cols: rows[0].length, grid: rows, starts, finish: starts[starts.length - 1] + 4 };
}
function ensureCourse(r) { if (!C || C.seed !== r.seed) { C = buildCourse(r.seed); paintCourse(); } }
const tileAt = (c, r) => (r < 0 || r >= ROWS || c < 0 || c >= C.cols ? "." : C.grid[r][c]);
const solid = (c, r) => SOLID.includes(tileAt(c, r));
/** The start of the piece you're in: where you come back after a fall. */
const checkpointAt = (x) => { let s = 0; for (const c of C.starts) if (c <= x) s = c; return s; };

// ── RUNNERS ─────────────────────────────────────────────────────────────────────────
const HW = 0.36, HH = 0.42; // half width and half height, in tiles (x, y is the middle of the body)
const newRunner = (x) => ({ x, y: ROWS - 1 - HH, vy: 0, g: 1, ground: true, coyote: 0, buffer: 0, boost: 0, dead: false, deadAt: 0, fin: 0, blk: 0, trail: [] });
const startX = () => 2; // everyone starts on the same spot: the others are ghosts
/** One physics step. input = { flip (pressed now) }. Returns "flip", "land", "pad", "dead", "fin" or null. */
function stepRunner(b, inp, dt) {
  if (b.dead || b.fin) return null;
  let ev = null;
  b.coyote = b.ground ? CONFIG.coyote : b.coyote - dt;
  b.buffer = inp.flip ? CONFIG.buffer : b.buffer - dt;
  if (b.buffer > 0 && b.coyote > 0) { b.g = -b.g; b.vy = b.g * CONFIG.flipKick; b.ground = false; b.coyote = b.buffer = 0; ev = "flip"; }
  b.boost = Math.max(0, b.boost - dt);
  const was = b.ground, x0 = b.x;
  b.x += CONFIG.speed * (b.boost > 0 ? CONFIG.padBoost : 1) * dt; // always running
  for (let r = Math.floor(b.y - HH + 0.02); r <= Math.floor(b.y + HH - 0.02); r++) if (solid(Math.floor(b.x + HW), r)) b.x = Math.floor(b.x + HW) - HW - 0.001; // a wall stops you
  b.blk = b.x - x0 < CONFIG.speed * dt * 0.3 ? b.blk + dt : 0;
  b.vy = Math.max(-CONFIG.maxFall, Math.min(CONFIG.maxFall, b.vy + b.g * CONFIG.gravity * dt));
  b.y += b.vy * dt; b.ground = false;
  let under = "";
  for (let c = Math.floor(b.x - HW + 0.02); c <= Math.floor(b.x + HW - 0.02); c++) {
    if (b.vy > 0 && solid(c, Math.floor(b.y + HH))) { b.y = Math.floor(b.y + HH) - HH; b.vy = 0; if (b.g > 0) { b.ground = true; under += tileAt(c, Math.floor(b.y + HH + 0.5)); } }
    else if (b.vy < 0 && solid(c, Math.floor(b.y - HH))) { b.y = Math.floor(b.y - HH) + 1 + HH; b.vy = 0; if (b.g < 0) { b.ground = true; under += tileAt(c, Math.floor(b.y - HH - 0.5)); } }
  }
  if (b.ground && !was) ev = ev || "land";
  if (under.includes(">")) { if (b.boost < CONFIG.padTime - 0.2) ev = "pad"; b.boost = CONFIG.padTime; }
  for (let r = Math.floor(b.y - HH); r <= Math.floor(b.y + HH); r++) for (let c = Math.floor(b.x - HW); c <= Math.floor(b.x + HW); c++) { // spikes fill the half of the tile they point out of
    const t = tileAt(c, r), inX = b.x + HW > c + 0.15 && b.x - HW < c + 0.85;
    if (inX && ((t === "^" && b.y + HH > r + 0.45) || (t === "v" && b.y - HH < r + 0.55))) { b.dead = true; return "dead"; }
  }
  if (b.y < -1.5 || b.y > ROWS + 1.5) { b.dead = true; return "dead"; }
  if (b.x >= C.finish) return "fin";
  return ev;
}
/** Back at the start of the piece you fell in, on the floor, gravity down. */
function respawn(b) { Object.assign(b, newRunner(checkpointAt(b.x) + 1.2), { trail: [] }); }

// ── RACE (HOST) ─────────────────────────────────────────────────────────────────────
const host = { acting: false, last: null, bots: new Map(), lastBots: 0, raceId: -1, again: false };
/** The race as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function race() {
  const r = shared("race", null);
  return host.last && isHost() && (!r || host.last.v > r.v) ? host.last : r;
}
function writeRace(r) { r = { ...r, v: (race()?.v ?? 0) + 1 }; host.last = r; net.setShared("race", JSON.stringify(r)); return r; }
const newRace = (id) => ({ id, phase: "grid", seed: (Math.random() * 1e9) | 0, startAt: clock() + CONFIG.countdown, endsAt: 0, fins: [], results: [] });
/** Become host: adopt the bots exactly as state has them (the race itself stays in state). */
function adopt() {
  host.acting = true; host.last = null; host.bots.clear(); host.raceId = race()?.id ?? -1;
  for (const s of shared("bots", [])) host.bots.set(s.i, Object.assign(newRunner(s.x), { id: s.i, name: s.n, color: s.c, y: s.y, vy: s.vy || 0, g: s.g || 1, ground: false, dead: !!s.d, deadAt: performance.now(), fin: s.fin || 0 }));
}
/** A new race: as many bots as empty seats, everyone back on the start line. */
function seatBots() {
  const humans = humansHere(), want = Math.max(0, Math.min(CONFIG.seats, CONFIG.maxRunners) - humans.length);
  while (host.bots.size > want) host.bots.delete([...host.bots.keys()].pop());
  while (host.bots.size < want) {
    const used = new Set([...host.bots.values()].map((b) => b.name)), taken = new Set([...humans.map(colorOf), ...[...host.bots.values()].map((b) => b.color)]);
    const id = "b" + Math.random().toString(36).slice(2, 6);
    host.bots.set(id, Object.assign(newRunner(0), { id, name: BOT_NAMES.find((n) => !used.has(n)) || "Bot", color: COLORS.find((c) => !taken.has(c)) || "#ccc" }));
  }
  let slot = humans.length;
  for (const b of host.bots.values()) Object.assign(b, newRunner(startX(slot++)), { id: b.id, name: b.name, color: b.color, flipAt: 0, lag: 80 + Math.random() * CONFIG.botStartLag });
}
/** The race is over: one write with the final order. */
function finishRace(r) {
  const all = standings(r);
  return writeRace({ ...r, phase: "done", endsAt: clock() + CONFIG.resultsMs, results: all.slice(0, 8).map((s) => ({ i: s.id, n: s.name, c: s.color, t: s.fin, x: Math.floor(s.x) })) });
}
function hostTick(dt, now) {
  if (!host.acting) adopt();
  let r = race();
  if (!r) r = writeRace(newRace(1));
  ensureCourse(r);
  if (host.raceId !== r.id) { host.raceId = r.id; seatBots(); }
  const T = clock();
  if (r.phase === "grid" && T >= r.startAt) r = writeRace({ ...r, phase: "race", endsAt: r.startAt + CONFIG.raceMs });
  if (r.phase === "race") {
    for (const b of host.bots.values()) botTick(b, dt, now, r);
    const fins = standings(r).filter((s) => s.fin && !r.fins.some((f) => f.i === s.id)); // new finishers, from each runner's own state
    if (fins.length) r = writeRace({ ...r, fins: [...r.fins, ...fins.map((s) => ({ i: s.id, t: s.fin }))].sort((a, b) => a.t - b.t), endsAt: r.fins.length ? r.endsAt : Math.min(r.endsAt, T + CONFIG.afterFirstMs) });
    const st = standings(r);
    if (T >= r.endsAt || st.every((s) => s.fin)) r = finishRace(r);
  }
  if (r.phase === "done" && (T >= r.endsAt || host.again)) r = writeRace(newRace(r.id + 1));
  host.again = false;
  const humans = humansHere().length; // someone joined mid-race: a bot steps aside
  while (host.bots.size && host.bots.size + humans > CONFIG.maxRunners) host.bots.delete([...host.bots.keys()].pop());
  if (now - host.lastBots > 100) { host.lastBots = now; net.setShared("bots", JSON.stringify([...host.bots.values()].map(botWire))); } // ~10/s

  list.innerHTML = "<li class=\"note\">Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li class=\"note\">No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"note\">Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { if (host.acting) host.again = true; else net.send("again", {}); };
let actx = null;
function sfx(kind) {
  if (!actx || ATTRACT) return;
  const [f0, f1, dur, vol, type] = { flip: [300, 900, 0.09, 0.05, "square"], pad: [500, 1400, 0.25, 0.06, "sawtooth"], dead: [500, 60, 0.4, 0.09, "sawtooth"], back: [300, 500, 0.12, 0.05, "sine"], win: [520, 1040, 0.5, 0.08, "triangle"] }[kind];
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
const wake = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
const FLIPS = [" ", "arrowup", "arrowdown", "w", "s", "z", "enter"];
addEventListener("keydown", (e) => { wake(); if (FLIPS.includes(e.key.toLowerCase())) { e.preventDefault(); if (!e.repeat) input.flip = true; } });
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); wake(); input.flip = true; }); // tap or click anywhere on the course
cv.addEventListener("contextmenu", (e) => e.preventDefault()); // a right-click flips too, without the browser menu
$("flipBtn").addEventListener("pointerdown", (e) => { e.preventDefault(); wake(); input.flip = true; $("flipBtn").classList.add("on"); });
for (const ev of ["pointerup", "pointercancel"]) $("flipBtn").addEventListener(ev, () => $("flipBtn").classList.remove("on"));
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, dtNow = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (performance.now() - lastTick > 1000) { hostHold = performance.now() + 700; host.acting = false; } // the tab was frozen or in the background: someone else may have hosted meanwhile, so let its state arrive, then adopt it
  lastTick = performance.now(); // not the rAF time: after a long freeze Chrome can stamp the first frame from before it ended
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; dtNow = dt; // the first frame can be timed before load: never negative
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  syncClock(now);
  if (isHost()) hostTick(dt, now); else host.acting = false;
  const r = race();
  if (r) { ensureCourse(r); syncViews(dt, r); myTick(dt, now, r); }
  tickFx(dt);
  draw(r, now);
  if (r && now - lastHud > 120) { lastHud = now; hud(r); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...shared("bots", []).map((b) => b.c)]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { countdown: 300, resultsMs: 1500, seats: 5 });
  startedAt = performance.now();
  requestAnimationFrame(frame);
})();
</script>
